name: Build SPT

on:
  workflow_dispatch:
  push:
    paths:
      - 'spt/**'
      - 'tools/*.ps1'
      - '.github/workflows/build-spt.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched SourcePauseTool
        shell: pwsh
        run: ./tools/prepare-spt.ps1

      - name: Build spt (Source Unpack / build 5135)
        shell: pwsh
        run: ./tools/build-spt.ps1 -Target spt

      - name: Build spt-2013 (Steam / SteamPipe)
        shell: pwsh
        run: ./tools/build-spt.ps1 -Target spt-2013

      - uses: actions/upload-artifact@v4
        with:
          name: spt-dlls
          path: |
            .local/SourcePauseTool/build/Release/spt.dll
            .local/SourcePauseTool/build/Release/spt-2013.dll
          if-no-files-found: error
